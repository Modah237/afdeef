<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="handsGradIcon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="40%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <!-- Left protective arm (cradling heart) -->
  <path d="M 52,106 C 28,103 8,82 8,56 C 8,38 21,24 38,24 C 47,24 55,29 60,37 C 54,29 44,21 34,22 C 16,24 3,40 3,60 C 3,89 27,112 55,114 Z" 
        fill="url(#handsGradIcon)" />

  <!-- Right protective arm with fingers -->
  <path d="M 58,114 C 86,112 110,89 110,60 C 110,40 97,24 79,22 C 69,21 59,29 53,37 C 58,29 66,24 75,24 C 92,24 105,38 105,56 C 105,82 85,103 61,106 Z" 
        fill="url(#handsGradIcon)" />

  <!-- Father (Blue) -->
  <g transform="translate(24, 40)">
    <circle cx="10" cy="8" r="6" fill="#1D4ED8" />
    <path d="M 3,36 C 3,24 8,18 16,18 C 19,18 21,20 22,23 L 18,36 Z" fill="#1D4ED8" />
  </g>

  <!-- Child (Green) -->
  <g transform="translate(48, 52)">
    <circle cx="8" cy="6" r="4.5" fill="#16A34A" />
    <path d="M 3,24 C 3,16 6,12 11,12 C 16,12 19,16 19,24 Z" fill="#16A34A" />
  </g>

  <!-- Mother (Coral / Terracotta) -->
  <g transform="translate(68, 41)">
    <circle cx="10" cy="8" r="6" fill="#E11D48" />
    <path d="M 4,35 C 5,22 10,18 17,18 C 22,18 25,23 25,35 Z" fill="#E11D48" />
  </g>

  <!-- AFDEEF acronym -->
  <text x="59" y="102" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="13" 
        font-weight="900" 
        letter-spacing="1.2" 
        fill="#1E40AF" 
        text-anchor="middle">
    AFDEEF
  </text>
</svg>
